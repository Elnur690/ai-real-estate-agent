services:
  db:
    image: postgres:16-alpine
    container_name: realestate_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "23332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: realestate_redis
    restart: always
    ports:
      - "23379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_backend
    restart: always
    command: >
      sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL
      - SYNC_DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - ENCRYPTION_KEY
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - TELEGRAM_BOT_TOKEN
      - EVOLUTION_API_URL
      - EVOLUTION_API_KEY
      - EVOLUTION_INSTANCE_NAME
      - WEBHOOK_SECRET
      - GEMINI_API_KEY
    ports:
      - "23800:8000"
    volumes:
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_celery_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL
      - SYNC_DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - ENCRYPTION_KEY
      - GEMINI_API_KEY
    volumes:
      - backup_data:/app/backups
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_celery_beat
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL
      - SYNC_DATABASE_URL
      - REDIS_URL
      - SECRET_KEY
      - ENCRYPTION_KEY
    volumes:
      - backup_data:/app/backups
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realestate_frontend
    restart: always
    ports:
      - "23300:80"
    depends_on:
      - backend

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: realestate_evolution
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:23880
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-42960a4e6597e231787c5e0124a06248}
      - API_KEY=${EVOLUTION_API_KEY:-42960a4e6597e231787c5e0124a06248}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_HOST=redis
      - CACHE_REDIS_PORT=6379
      - CACHE_REDIS_DB=1
    ports:
      - "23880:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  backup_data:
